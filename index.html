<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Simple Transfer - Your notes, synced across all devices in real-time.">
  <title>Simple Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-secondary: #888888;
      --text-tertiary: #555555;
      --accent: #ff0000;
      --divider: #222222;
      --hover: #111111;
      --success: #00ff00;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: var(--bg);
    }

    .login-screen.hidden {
      display: none;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 40px 20px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .login-logo-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .login-subtitle {
      font-size: 12px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
    }

    .login-panel {
      background: var(--bg);
      border: 1px solid var(--divider);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-tabs {
      display: flex;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 20px;
    }

    .login-tab {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .login-tab:hover {
      color: var(--text-secondary);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-input-label {
      font-size: 10px;
      color: var(--text-secondary);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-input-field {
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text);
      font-size: 13px;
      padding: 12px 12px;
      font-family: 'IBM Plex Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
      min-height: 44px;
      width: 100%;
    }

    .login-input-field::placeholder {
      color: var(--text-tertiary);
    }

    .login-input-field:focus {
      border-color: var(--accent);
    }



    .login-btn {
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      transition: all 0.15s;
      margin-top: 8px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-btn:active {
      background: var(--hover);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      color: var(--accent);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
      min-height: 18px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .login-divider span {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .login-social {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      transition: all 0.15s;
      min-height: 44px;
    }

    .login-social-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-social-icon {
      width: 16px;
      height: 16px;
    }

    .login-footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 20px;
    }

    .login-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--divider);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== MAIN SCREEN ==================== */
    .main-screen {
      display: none;
    }

    .main-screen.visible {
      display: flex;
      height: 100vh;
    }

    .app-container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .sidebar {
      width: 260px;
      background: var(--bg);
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--divider);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .logo-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
    }

    .user-section {
      padding: 15px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-initial {
      width: 24px;
      height: 24px;
      background: var(--bg);
      border: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .user-name {
      font-size: 12px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-radius: 2px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logout-btn:hover {
      color: var(--accent);
      background: var(--hover);
    }

    .search-container {
      padding: 15px 20px;
      border-bottom: 1px solid var(--divider);
      position: relative;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--divider);
      color: var(--text);
      font-size: 12px;
      padding: 6px 0;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    .search-clear {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 12px;
      display: none;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-clear:hover {
      color: var(--accent);
    }

    .notes-header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-tertiary);
    }

    .notes-count {
      letter-spacing: 0.5px;
    }

    .sort-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      padding: 8px;
      min-height: 44px;
    }

    .sort-toggle:hover {
      color: var(--text-secondary);
    }

    .sort-label {
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .new-note-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      width: calc(100% - 40px);
      margin: 8px 20px;
      text-align: left;
      transition: all 0.15s;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .new-note-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .new-note-btn:active {
      background: var(--hover);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
    }

    .notes-list::-webkit-scrollbar {
      width: 4px;
    }

    .notes-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .notes-list::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 2px;
    }

    .note-item {
      padding: 10px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background 0.1s;
      position: relative;
      min-height: 60px;
    }

    .note-item:hover {
      background: var(--hover);
    }

    .note-item.selected {
      background: #050505;
    }

    .note-item.pinned {
      background: rgba(255, 0, 0, 0.03);
    }

    .note-item.selected.pinned {
      background: rgba(255, 0, 0, 0.05);
    }

    .note-pin {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      padding: 8px;
      min-width: 28px;
      min-height: 28px;
    }

    .note-item:hover .note-pin,
    .note-item.pinned .note-pin {
      opacity: 1;
    }

    .note-pin.pinned {
      color: var(--accent);
    }

    .note-pin:hover {
      color: var(--accent);
    }

    .note-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .note-title {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .note-preview {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .note-delete {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.1s;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .note-item:hover .note-delete {
      opacity: 1;
    }

    .note-delete:hover {
      color: var(--accent);
    }

    .status-indicator {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 10px;
      height: 10px;
      background: var(--text-tertiary);
      border-radius: 50%;
      z-index: 999;
      box-shadow: 0 0 4px currentColor;
    }

    .status-indicator.online {
      background: var(--success);
    }

    .status-indicator.offline {
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 38px;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      display: none;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .save-status {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--divider);
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-radius: 2px;
      transition: all 0.15s;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .editor::-webkit-scrollbar {
      width: 4px;
    }

    .editor::-webkit-scrollbar-track {
      background: transparent;
    }

    .editor::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 2px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin: 0 0 20px 0;
      outline: none;
      resize: none;
    }

    .title-input::placeholder {
      color: var(--text-tertiary);
    }

    .content-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin: 0;
      outline: none;
      resize: none;
    }

    .content-input::placeholder {
      color: var(--text-tertiary);
    }

    .editor-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-count {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-tertiary);
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .toast {
      position: fixed;
      bottom: 56px;
      right: 16px;
      background: var(--hover);
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 8px 12px;
      border-radius: 2px;
      z-index: 1001;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 998;
    }

    .mobile-overlay.show {
      display: block;
    }

    @media (max-width: 768px) {
      .mobile-overlay {
        display: none;
      }
      .mobile-overlay.show {
        display: block;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        z-index: 1000;
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-btn {
        display: flex;
        font-size: 18px;
      }
      .top-bar-left {
        gap: 8px;
      }
      .editor {
        padding: 16px;
      }
      .title-input {
        font-size: 18px;
        padding: 4px 0;
      }
      .content-input {
        font-size: 14px;
        line-height: 1.5;
        padding: 4px 0;
      }
      .note-delete {
        right: 12px;
      }
      .note-item {
        padding: 12px;
      }
      .note-item:hover .note-pin {
        opacity: 1;
      }
      .note-item:hover .note-delete {
        opacity: 1;
      }
      .new-note-btn {
        margin: 8px 12px;
        width: calc(100% - 24px);
      }
      .search-container {
        padding: 12px;
      }
      .user-section {
        padding: 12px;
      }
      .login-panel {
        padding: 28px 20px;
      }
      .login-input-field {
        font-size: 13px;
        padding: 12px 12px;
      }
      .login-btn {
        padding: 12px 16px;
        font-size: 12px;
      }
      .toast {
        bottom: 64px;
        right: 8px;
        font-size: 12px;
      }
      .status-indicator {
        bottom: 88px;
        right: 20px;
        width: 8px;
        height: 8px;
      }
      .char-count {
        font-size: 11px;
      }
      .action-btn {
        padding: 8px 12px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 100%;
      }
      .login-panel {
        width: 90%;
        max-width: 320px;
        padding: 24px 16px;
      }
      .login-input-field {
        font-size: 16px;
        padding: 14px 12px;
      }
      .login-btn {
        padding: 14px 16px;
        font-size: 12px;
      }
      .login-social-btn {
        padding: 14px 16px;
        font-size: 11px;
      }
      .editor {
        padding: 12px;
      }
      .title-input {
        font-size: 16px;
      }
      .content-input {
        font-size: 13px;
      }
      .top-bar {
        padding: 0 8px;
        min-height: 56px;
      }
    }
  </style>
