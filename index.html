<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Simple Transfer - Your notes, synced across all devices in real-time.">
  <title>Simple Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-secondary: #888888;
      --text-tertiary: #555555;
      --accent: #ff0000;
      --divider: #222222;
      --hover: #111111;
      --success: #00ff00;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: var(--bg);
    }

    .login-screen.hidden {
      display: none;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 40px 20px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .login-logo-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .login-subtitle {
      font-size: 12px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
    }

    .login-panel {
      background: var(--bg);
      border: 1px solid var(--divider);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-tabs {
      display: flex;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 20px;
    }

    .login-tab {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .login-tab:hover {
      color: var(--text-secondary);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-input-label {
      font-size: 10px;
      color: var(--text-secondary);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-input-field {
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text);
      font-size: 13px;
      padding: 12px 12px;
      font-family: 'IBM Plex Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
      min-height: 44px;
      width: 100%;
    }

    .login-input-field::placeholder {
      color: var(--text-tertiary);
    }

    .login-input-field:focus {
      border-color: var(--accent);
    }



    .login-btn {
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      transition: all 0.15s;
      margin-top: 8px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-btn:active {
      background: var(--hover);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      color: var(--accent);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
      min-height: 18px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .login-divider span {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .login-social {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      transition: all 0.15s;
      min-height: 44px;
    }

    .login-social-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-social-icon {
      width: 16px;
      height: 16px;
    }

    .login-footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 20px;
    }

    .login-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--divider);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== MAIN SCREEN ==================== */
    .main-screen {
      display: none;
    }

    .main-screen.visible {
      display: flex;
      height: 100vh;
    }

    .app-container {
      display: flex;
      height: 100%;
      width: 100%;
    }

    .sidebar {
      width: 260px;
      background: var(--bg);
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--divider);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .logo-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
    }

    .user-section {
      padding: 15px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-initial {
      width: 24px;
      height: 24px;
      background: var(--bg);
      border: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .user-name {
      font-size: 12px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-radius: 2px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logout-btn:hover {
      color: var(--accent);
      background: var(--hover);
    }

    .search-container {
      padding: 15px 20px;
      border-bottom: 1px solid var(--divider);
      position: relative;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--divider);
      color: var(--text);
      font-size: 12px;
      padding: 6px 0;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    .search-clear {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 12px;
      display: none;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-clear:hover {
      color: var(--accent);
    }

    .notes-header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-tertiary);
    }

    .notes-count {
      letter-spacing: 0.5px;
    }

    .sort-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      padding: 8px;
      min-height: 44px;
    }

    .sort-toggle:hover {
      color: var(--text-secondary);
    }

    .sort-label {
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .new-note-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      width: calc(100% - 40px);
      margin: 8px 20px;
      text-align: left;
      transition: all 0.15s;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .new-note-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .new-note-btn:active {
      background: var(--hover);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
    }

    .notes-list::-webkit-scrollbar {
      width: 4px;
    }

    .notes-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .notes-list::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 2px;
    }

    .note-item {
      padding: 10px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background 0.1s;
      position: relative;
      min-height: 60px;
    }

    .note-item:hover {
      background: var(--hover);
    }

    .note-item.selected {
      background: #050505;
    }

    .note-item.pinned {
      background: rgba(255, 0, 0, 0.03);
    }

    .note-item.selected.pinned {
      background: rgba(255, 0, 0, 0.05);
    }

    .note-pin {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      padding: 8px;
      min-width: 28px;
      min-height: 28px;
    }

    .note-item:hover .note-pin,
    .note-item.pinned .note-pin {
      opacity: 1;
    }

    .note-pin.pinned {
      color: var(--accent);
    }

    .note-pin:hover {
      color: var(--accent);
    }

    .note-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .note-title {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .note-preview {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .note-delete {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.1s;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .note-item:hover .note-delete {
      opacity: 1;
    }

    .note-delete:hover {
      color: var(--accent);
    }

    .status-indicator {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 10px;
      height: 10px;
      background: var(--text-tertiary);
      border-radius: 50%;
      z-index: 999;
      box-shadow: 0 0 4px currentColor;
    }

    .status-indicator.online {
      background: var(--success);
    }

    .status-indicator.offline {
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 38px;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      display: none;
      padding: 8px;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .save-status {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--divider);
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      padding: 8px 12px;
      border-radius: 2px;
      transition: all 0.15s;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .editor::-webkit-scrollbar {
      width: 4px;
    }

    .editor::-webkit-scrollbar-track {
      background: transparent;
    }

    .editor::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 2px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin: 0 0 20px 0;
      outline: none;
      resize: none;
    }

    .title-input::placeholder {
      color: var(--text-tertiary);
    }

    .content-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin: 0;
      outline: none;
      resize: none;
    }

    .content-input::placeholder {
      color: var(--text-tertiary);
    }

    .editor-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-count {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-tertiary);
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .toast {
      position: fixed;
      bottom: 56px;
      right: 16px;
      background: var(--hover);
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 8px 12px;
      border-radius: 2px;
      z-index: 1001;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 998;
    }

    .mobile-overlay.show {
      display: block;
    }

    @media (max-width: 768px) {
      .mobile-overlay {
        display: none;
      }
      .mobile-overlay.show {
        display: block;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        z-index: 1000;
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-btn {
        display: flex;
        font-size: 18px;
      }
      .top-bar-left {
        gap: 8px;
      }
      .editor {
        padding: 16px;
      }
      .title-input {
        font-size: 18px;
        padding: 4px 0;
      }
      .content-input {
        font-size: 14px;
        line-height: 1.5;
        padding: 4px 0;
      }
      .note-delete {
        right: 12px;
      }
      .note-item {
        padding: 12px;
      }
      .note-item:hover .note-pin {
        opacity: 1;
      }
      .note-item:hover .note-delete {
        opacity: 1;
      }
      .new-note-btn {
        margin: 8px 12px;
        width: calc(100% - 24px);
      }
      .search-container {
        padding: 12px;
      }
      .user-section {
        padding: 12px;
      }
      .login-panel {
        padding: 28px 20px;
      }
      .login-input-field {
        font-size: 13px;
        padding: 12px 12px;
      }
      .login-btn {
        padding: 12px 16px;
        font-size: 12px;
      }
      .toast {
        bottom: 64px;
        right: 8px;
        font-size: 12px;
      }
      .status-indicator {
        bottom: 88px;
        right: 20px;
        width: 8px;
        height: 8px;
      }
      .char-count {
        font-size: 11px;
      }
      .action-btn {
        padding: 8px 12px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 100%;
      }
      .login-panel {
        width: 90%;
        max-width: 320px;
        padding: 24px 16px;
      }
      .login-input-field {
        font-size: 16px;
        padding: 14px 12px;
      }
      .login-btn {
        padding: 14px 16px;
        font-size: 12px;
      }
      .login-social-btn {
        padding: 14px 16px;
        font-size: 11px;
      }
      .editor {
        padding: 12px;
      }
      .title-input {
        font-size: 16px;
      }
      .content-input {
        font-size: 13px;
      }
      .top-bar {
        padding: 0 8px;
        min-height: 56px;
      }
      .top-bar-right {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .action-btn {
        padding: 8px 10px;
        font-size: 10px;
        min-height: 36px;
      }
      .notes-count {
        font-size: 11px;
      }
      .sort-label {
        font-size: 11px;
      }
      .menu-btn {
        min-width: 40px;
        min-height: 40px;
      }
      .note-item {
        min-height: 64px;
      }
      .toast {
        bottom: 70px;
        right: 8px;
        font-size: 12px;
        left: 8px;
      }
      .status-indicator {
        bottom: 98px;
        right: auto;
        left: 16px;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">
          <div class="login-logo-dot"></div>
          SIMPLE TRANSFER
        </div>
        <p class="login-subtitle">Your notes, synced across all devices</p>
      </div>
      
      <div class="login-panel">
        <div class="login-tabs">
          <button type="button" class="login-tab active" id="loginTab">LOGIN</button>
          <button type="button" class="login-tab" id="registerTab">REGISTER</button>
        </div>
        
        <form class="login-form" id="authForm">
          <div class="login-input-group">
            <label class="login-input-label" id="emailLabel">EMAIL</label>
            <input type="text" class="login-input-field" id="emailInput" 
                   placeholder="Enter your email" autocomplete="username" required>
          </div>
          
          <div class="login-input-group">
            <label class="login-input-label">PASSWORD</label>
            <input type="password" class="login-input-field" id="passwordInput" 
                   placeholder="Enter your password" autocomplete="current-password" required>
          </div>
          
          <button type="submit" class="login-btn" id="authSubmit">LOGIN</button>
          
          <div class="login-error" id="authError"></div>
        </form>
        
        <div class="login-divider">
          <span>OR</span>
        </div>
        
        <div class="login-social">
          <button type="button" class="login-social-btn" id="googleSignIn">
            <svg class="login-social-icon" viewBox="0 0 24 24">
              <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            SIGN IN WITH GOOGLE
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="main-screen" id="mainScreen">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="app-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-dot"></div>
            SIMPLE TRANSFER
          </div>
        </div>

        <div class="user-section">
          <div class="user-info">
            <div class="user-initial" id="userInitial"></div>
            <div class="user-name" id="userName"></div>
          </div>
          <button type="button" class="logout-btn" id="logoutBtn" title="Logout">LOGOUT</button>
        </div>

        <div class="search-container">
          <input type="text" class="search-input" id="searchInput" placeholder="Search notes...">
          <button type="button" class="search-clear" id="searchClear" title="Clear search">&times;</button>
        </div>

        <div class="notes-header">
          <span class="notes-count" id="notesCount">0 NOTES</span>
          <div class="sort-toggle" id="sortToggle" title="Toggle sort order">
            <span class="sort-label">LATEST</span>
            <span>▼</span>
          </div>
        </div>

        <button type="button" class="new-note-btn" id="newNoteBtn">+ NEW NOTE</button>

        <div class="notes-list" id="notesList"></div>
      </aside>

      <main class="main-content">
        <div class="top-bar">
          <div class="top-bar-left">
            <button type="button" class="menu-btn" id="menuBtn" title="Toggle menu">☰</button>
            <span class="save-status" id="saveStatus">SAVED</span>
          </div>
          <div class="top-bar-right">
            <button type="button" class="action-btn" id="shareBtn" title="Share">SHARE</button>
            <button type="button" class="action-btn" id="exportBtn" title="Export">EXPORT</button>
          </div>
        </div>

        <div class="editor-container">
          <div class="editor">
            <input type="text" class="title-input" id="titleInput" placeholder="Note Title...">
            <textarea class="content-input" id="contentInput" placeholder="Start typing..."></textarea>
            <div class="empty-state" id="emptyState">No note selected</div>
          </div>
          <div class="editor-footer">
            <span class="char-count" id="charCount">0 characters</span>
          </div>
        </div>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <div class="status-indicator" id="statusIndicator"></div>
  </div>

  <script>
    // ==================== GLOBALS ====================
    const supabase = window.supabase.createClient(
      'https://ucbvzklhyvzwfpsuvjeb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYnZ6a2xoeXZ6d2Zwc3V2amViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjU5MzEyNjQsImV4cCI6MjA0MTUwNzI2NH0.ggpn5qIbYKgZwcYvBLCHzFDGzEsD3TzZvdL9L9C8gps'
    );

    let currentUser = null;
    let currentNoteId = null;
    let notes = [];
    let sortAscending = false;
    let searchQuery = '';
    let saveTimeout = null;
    let originalNoteContent = {};

    // ==================== DOM ELEMENTS ====================
    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const authSubmit = document.getElementById('authSubmit');
    const authError = document.getElementById('authError');
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const emailLabel = document.getElementById('emailLabel');

    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const newNoteBtn = document.getElementById('newNoteBtn');
    const notesList = document.getElementById('notesList');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const notesCount = document.getElementById('notesCount');
    const sortToggle = document.getElementById('sortToggle');
    const titleInput = document.getElementById('titleInput');
    const contentInput = document.getElementById('contentInput');
    const emptyState = document.getElementById('emptyState');
    const charCount = document.getElementById('charCount');
    const userInitial = document.getElementById('userInitial');
    const userName = document.getElementById('userName');
    const logoutBtn = document.getElementById('logoutBtn');
    const saveStatus = document.getElementById('saveStatus');
    const toast = document.getElementById('toast');
    const statusIndicator = document.getElementById('statusIndicator');
    const googleSignIn = document.getElementById('googleSignIn');
    const shareBtn = document.getElementById('shareBtn');
    const exportBtn = document.getElementById('exportBtn');

    // ==================== EVENT LISTENERS ====================
    authForm.addEventListener('submit', handleAuth);
    loginTab.addEventListener('click', () => switchAuthTab('login'));
    registerTab.addEventListener('click', () => switchAuthTab('register'));
    newNoteBtn.addEventListener('click', createNewNote);
    searchInput.addEventListener('input', handleSearch);
    searchClear.addEventListener('click', clearSearch);
    sortToggle.addEventListener('click', toggleSort);
    titleInput.addEventListener('input', handleTitleChange);
    contentInput.addEventListener('input', handleContentChange);
    logoutBtn.addEventListener('click', logout);
    menuBtn.addEventListener('click', toggleSidebar);
    mobileOverlay.addEventListener('click', closeSidebar);
    googleSignIn.addEventListener('click', handleGoogleSignIn);
    shareBtn.addEventListener('click', handleShare);
    exportBtn.addEventListener('click', handleExport);

    // ==================== AUTH FUNCTIONS ====================
    async function handleAuth(e) {
      e.preventDefault();
      const email = emailInput.value;
      const password = passwordInput.value;
      const isLogin = loginTab.classList.contains('active');

      authSubmit.disabled = true;
      authError.textContent = '';

      try {
        let result;
        if (isLogin) {
          result = await supabase.auth.signInWithPassword({ email, password });
        } else {
          result = await supabase.auth.signUp({ email, password });
        }

        if (result.error) throw result.error;
        showToast(isLogin ? 'Logged in successfully' : 'Account created! Check your email.');
      } catch (error) {
        authError.textContent = error.message;
      } finally {
        authSubmit.disabled = false;
      }
    }

    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      loginTab.classList.toggle('active');
      registerTab.classList.toggle('active');
      authSubmit.textContent = isLogin ? 'LOGIN' : 'REGISTER';
      emailLabel.textContent = isLogin ? 'EMAIL' : 'EMAIL';
      authError.textContent = '';
    }

    async function handleGoogleSignIn() {
      try {
        const { data, error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin },
        });
        if (error) throw error;
      } catch (error) {
        authError.textContent = error.message;
      }
    }

    async function logout() {
      const { error } = await supabase.auth.signOut();
      if (error) {
        showToast('Logout failed');
      }
    }

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session?.user) {
        currentUser = session.user;
        loginScreen.classList.add('hidden');
        mainScreen.classList.add('visible');
        setupUI();
        loadNotes();
        setupRealtimeListener();
        window.addEventListener('online', () => updateStatusIndicator(true));
        window.addEventListener('offline', () => updateStatusIndicator(false));
        updateStatusIndicator(navigator.onLine);
      }
    }

    supabase.auth.onAuthStateChange(() => checkAuth());

    // ==================== NOTE FUNCTIONS ====================
    async function createNewNote() {
      try {
        const { data, error } = await supabase
          .from('notes')
          .insert([{ user_id: currentUser.id, title: 'Untitled', content: '' }])
          .select();

        if (error) throw error;
        notes.unshift(data[0]);
        currentNoteId = data[0].id;
        originalNoteContent = { title: data[0].title, content: data[0].content };
        renderNotes();
        displayNote(data[0]);
        closeSidebar();
      } catch (error) {
        showToast('Failed to create note');
      }
    }

    async function loadNotes() {
      try {
        const { data, error } = await supabase
          .from('notes')
          .select('*')
          .eq('user_id', currentUser.id)
          .order('updated_at', { ascending: sortAscending });

        if (error) throw error;
        notes = data || [];
        renderNotes();
      } catch (error) {
        showToast('Failed to load notes');
      }
    }

    function setupRealtimeListener() {
      supabase
        .channel('notes_channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'notes', filter: `user_id=eq.${currentUser.id}` }, (payload) => {
          if (payload.eventType === 'INSERT') {
            if (!notes.find(n => n.id === payload.new.id)) {
              notes.unshift(payload.new);
              renderNotes();
            }
          } else if (payload.eventType === 'UPDATE') {
            const index = notes.findIndex(n => n.id === payload.new.id);
            if (index !== -1) {
              notes[index] = payload.new;
              if (currentNoteId === payload.new.id) {
                displayNote(payload.new);
              }
              renderNotes();
            }
          } else if (payload.eventType === 'DELETE') {
            notes = notes.filter(n => n.id !== payload.old.id);
            if (currentNoteId === payload.old.id) {
              currentNoteId = null;
              titleInput.value = '';
              contentInput.value = '';
              emptyState.style.display = 'flex';
            }
            renderNotes();
          }
        })
        .subscribe();
    }

    function renderNotes() {
      const filtered = notes.filter(n => n.title.toLowerCase().includes(searchQuery.toLowerCase()) || n.content.toLowerCase().includes(searchQuery.toLowerCase()));
      notesCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'NOTE' : 'NOTES'}`;
      notesList.innerHTML = filtered.map(note => `
        <div class="note-item ${note.id === currentNoteId ? 'selected' : ''} ${note.pinned ? 'pinned' : ''}" data-id="${note.id}">
          <div class="note-pin ${note.pinned ? 'pinned' : ''}" data-id="${note.id}" title="Pin note">📌</div>
          <div class="note-content">
            <div class="note-title">${note.title || 'Untitled'}</div>
            <div class="note-preview">${note.content || '(empty)'}</div>
          </div>
          <button type="button" class="note-delete" data-id="${note.id}" title="Delete note">×</button>
        </div>
      `).join('');

      document.querySelectorAll('.note-item').forEach(item => {
        item.addEventListener('click', () => {
          const noteId = item.dataset.id;
          currentNoteId = noteId;
          const note = notes.find(n => n.id === noteId);
          displayNote(note);
          renderNotes();
          closeSidebar();
        });
      });

      document.querySelectorAll('.note-pin').forEach(pin => {
        pin.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePin(pin.dataset.id);
        });
      });

      document.querySelectorAll('.note-delete').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteNote(btn.dataset.id);
        });
      });
    }

    function displayNote(note) {
      titleInput.value = note.title;
      contentInput.value = note.content;
      originalNoteContent = { title: note.title, content: note.content };
      updateCharCount();
      emptyState.style.display = 'none';
      titleInput.style.display = 'block';
      contentInput.style.display = 'block';
    }

    async function handleTitleChange() {
      saveStatus.textContent = 'SAVING...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => saveNote(), 1000);
    }

    async function handleContentChange() {
      updateCharCount();
      saveStatus.textContent = 'SAVING...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => saveNote(), 1000);
    }

    async function saveNote() {
      if (!currentNoteId) return;
      const title = titleInput.value || 'Untitled';
      const content = contentInput.value;

      if (title === originalNoteContent.title && content === originalNoteContent.content) {
        saveStatus.textContent = 'SAVED';
        return;
      }

      try {
        const { error } = await supabase
          .from('notes')
          .update({ title, content, updated_at: new Date() })
          .eq('id', currentNoteId);

        if (error) throw error;
        originalNoteContent = { title, content };
        saveStatus.textContent = 'SAVED';
      } catch (error) {
        saveStatus.textContent = 'ERROR';
      }
    }

    async function deleteNote(noteId) {
      if (!confirm('Delete this note?')) return;
      try {
        const { error } = await supabase.from('notes').delete().eq('id', noteId);
        if (error) throw error;
        showToast('Note deleted');
      } catch (error) {
        showToast('Failed to delete note');
      }
    }

    async function togglePin(noteId) {
      const note = notes.find(n => n.id === noteId);
      try {
        const { error } = await supabase
          .from('notes')
          .update({ pinned: !note.pinned })
          .eq('id', noteId);

        if (error) throw error;
      } catch (error) {
        showToast('Failed to pin note');
      }
    }

    function handleSearch() {
      searchQuery = searchInput.value;
      searchClear.style.display = searchQuery ? 'flex' : 'none';
      renderNotes();
    }

    function clearSearch() {
      searchInput.value = '';
      searchQuery = '';
      searchClear.style.display = 'none';
      renderNotes();
    }

    function toggleSort() {
      sortAscending = !sortAscending;
      loadNotes();
    }

    function updateCharCount() {
      charCount.textContent = `${contentInput.value.length} characters`;
    }

    function setupUI() {
      userInitial.textContent = currentUser.email?.[0].toUpperCase() || '?';
      userName.textContent = currentUser.email || 'User';
    }

    function handleShare() {
      if (!currentNoteId) {
        showToast('No note selected');
        return;
      }
      const note = notes.find(n => n.id === currentNoteId);
      const text = `${note.title}\n\n${note.content}`;
      if (navigator.share) {
        navigator.share({ title: note.title, text });
      } else {
        navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
      }
    }

    function handleExport() {
      if (!currentNoteId) {
        showToast('No note selected');
        return;
      }
      const note = notes.find(n => n.id === currentNoteId);
      const element = document.createElement('a');
      element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(`${note.title}\n\n${note.content}`));
      element.setAttribute('download', `${note.title || 'note'}.txt`);
      element.style.display = 'none';
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
      showToast('Note exported');
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      mobileOverlay.classList.toggle('show');
    }

    function closeSidebar() {
      sidebar.classList.remove('open');
      mobileOverlay.classList.remove('show');
    }

    function updateStatusIndicator(online) {
      statusIndicator.classList.toggle('online', online);
      statusIndicator.classList.toggle('offline', !online);
    }

    checkAuth();
  </script>
</body>
</html>
