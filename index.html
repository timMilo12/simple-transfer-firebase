<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Simple Transfer - Your notes, synced across all devices in real-time.">
  <title>Simple Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-secondary: #888888;
      --text-tertiary: #555555;
      --accent: #ff0000;
      --divider: #222222;
      --hover: #111111;
      --success: #00ff00;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==================== LOGIN SCREEN ==================== */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      background: var(--bg);
    }

    .login-screen.hidden {
      display: none;
    }

    .login-container {
      width: 100%;
      max-width: 380px;
      padding: 40px 20px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .login-logo-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .login-subtitle {
      font-size: 12px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
    }

    .login-panel {
      background: var(--bg);
      border: 1px solid var(--divider);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-tabs {
      display: flex;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 20px;
    }

    .login-tab {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
    }

    .login-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    .login-tab:hover {
      color: var(--text-secondary);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .login-input-label {
      font-size: 10px;
      color: var(--text-secondary);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .login-input-field {
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text);
      font-size: 13px;
      padding: 10px 12px;
      font-family: 'IBM Plex Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .login-input-field::placeholder {
      color: var(--text-tertiary);
    }

    .login-input-field:focus {
      border-color: var(--accent);
    }

    .login-password-toggle {
      position: relative;
    }

    .login-password-toggle .login-input-field {
      padding-right: 36px;
    }

    .password-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 12px;
      padding: 2px;
    }

    .password-eye:hover {
      color: var(--text-secondary);
    }

    .login-btn {
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      transition: all 0.15s;
      margin-top: 8px;
    }

    .login-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-btn:active {
      background: var(--hover);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      color: var(--accent);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
      min-height: 18px;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--divider);
    }

    .login-divider span {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .login-social {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      transition: all 0.15s;
    }

    .login-social-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-social-icon {
      width: 16px;
      height: 16px;
    }

    .login-footer {
      text-align: center;
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 20px;
    }

    .login-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--divider);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==================== MAIN SCREEN ==================== */
    .main-screen {
      display: none;
      height: 100vh;
      width: 100%;
    }

    .main-screen.visible {
      display: flex;
    }

    .app-container {
      display: flex;
      height: 100%;
    }

    .sidebar {
      width: 260px;
      background: var(--bg);
      border-right: 1px solid var(--divider);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--divider);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .logo-dot {
      width: 5px;
      height: 5px;
      background: var(--accent);
      border-radius: 50%;
    }

    .user-section {
      padding: 15px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-initial {
      width: 24px;
      height: 24px;
      background: var(--bg);
      border: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .user-name {
      font-size: 12px;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      max-width: 150px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      padding: 3px 6px;
      border-radius: 2px;
    }

    .logout-btn:hover {
      color: var(--accent);
      background: var(--hover);
    }

    .search-container {
      padding: 15px 20px;
      border-bottom: 1px solid var(--divider);
      position: relative;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--divider);
      color: var(--text);
      font-size: 12px;
      padding: 6px 0;
      font-family: 'IBM Plex Mono', monospace;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:focus {
      outline: none;
      border-bottom-color: var(--accent);
    }

    .search-clear {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 12px;
      display: none;
      padding: 2px;
    }

    .search-clear:hover {
      color: var(--accent);
    }

    .notes-header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text-tertiary);
    }

    .notes-count {
      letter-spacing: 0.5px;
    }

    .sort-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .sort-toggle:hover {
      color: var(--text-secondary);
    }

    .sort-label {
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .new-note-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      width: calc(100% - 40px);
      margin: 8px 20px;
      text-align: left;
      transition: all 0.15s;
    }

    .new-note-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .new-note-btn:active {
      background: var(--hover);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
    }

    .notes-list::-webkit-scrollbar {
      width: 4px;
    }

    .notes-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .notes-list::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 2px;
    }

    .note-item {
      padding: 10px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: flex-start;
      gap: 8px;
      transition: background 0.1s;
      position: relative;
    }

    .note-item:hover {
      background: var(--hover);
    }

    .note-item.selected {
      background: #050505;
    }

    .note-item.pinned {
      background: rgba(255, 0, 0, 0.03);
    }

    .note-item.selected.pinned {
      background: rgba(255, 0, 0, 0.05);
    }

    .note-pin {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .note-item:hover .note-pin,
    .note-item.pinned .note-pin {
      opacity: 1;
    }

    .note-pin.pinned {
      color: var(--accent);
    }

    .note-pin:hover {
      color: var(--accent);
    }

    .note-content {
      flex: 1;
      min-width: 0;
    }

    .note-title {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }

    .note-preview {
      font-size: 11px;
      color: var(--text-tertiary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .note-delete {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.1s;
      padding: 2px;
    }

    .note-item:hover .note-delete {
      opacity: 1;
    }

    .note-delete:hover {
      color: var(--accent);
    }

    .status-indicator {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 10px;
      height: 10px;
      background: var(--text-tertiary);
      border-radius: 50%;
      z-index: 1000;
      box-shadow: 0 0 4px currentColor;
    }

    .status-indicator.online {
      background: var(--success);
    }

    .status-indicator.offline {
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      height: 38px;
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      display: none;
      padding: 4px;
    }

    .save-status {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--divider);
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 2px;
      transition: all 0.15s;
    }

    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
    }

    .editor::-webkit-scrollbar {
      width: 4px;
    }

    .editor::-webkit-scrollbar-track {
      background: transparent;
    }

    .editor::-webkit-scrollbar-thumb {
      background: var(--divider);
      border-radius: 2px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 24px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin: 0 0 20px 0;
      outline: none;
      resize: none;
    }

    .title-input::placeholder {
      color: var(--text-tertiary);
    }

    .content-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      font-family: 'Inter', sans-serif;
      padding: 0;
      margin: 0;
      outline: none;
      resize: none;
    }

    .content-input::placeholder {
      color: var(--text-tertiary);
    }

    .editor-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-count {
      font-size: 10px;
      color: var(--text-tertiary);
      font-family: 'IBM Plex Mono', monospace;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-tertiary);
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .toast {
      position: fixed;
      bottom: 48px;
      right: 16px;
      background: var(--hover);
      border: 1px solid var(--divider);
      color: var(--text-secondary);
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      padding: 8px 12px;
      border-radius: 2px;
      z-index: 1001;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }

    .mobile-overlay.show {
      display: block;
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        z-index: 1000;
        width: 280px;
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .menu-btn {
        display: block;
        font-size: 18px;
        padding: 6px;
      }
      .top-bar-left {
        gap: 8px;
      }
      .editor {
        padding: 16px;
      }
      .title-input {
        font-size: 18px;
        padding: 4px 0;
      }
      .content-input {
        font-size: 14px;
        line-height: 1.5;
        padding: 4px 0;
      }
      .note-delete {
        right: 12px;
      }
      .note-item {
        padding: 12px;
      }
      .note-item:hover .note-pin {
        opacity: 1;
      }
      .note-item:hover .note-delete {
        opacity: 1;
      }
      .new-note-btn {
        margin: 8px 12px;
        width: calc(100% - 24px);
      }
      .search-container {
        padding: 12px;
      }
      .user-section {
        padding: 12px;
      }
      .login-panel {
        padding: 28px 20px;
      }
      .login-input-field {
        font-size: 13px;
        padding: 11px 12px;
      }
      .login-btn {
        padding: 13px 16px;
        font-size: 12px;
      }
      .toast {
        bottom: 24px;
        right: 8px;
        font-size: 12px;
      }
      .status-indicator {
        bottom: 20px;
        right: 20px;
        width: 8px;
        height: 8px;
      }
      .char-count {
        font-size: 11px;
      }
      .action-btn {
        padding: 6px 10px;
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .sidebar {
        width: 100%;
      }
      .login-panel {
        width: 90%;
        max-width: 320px;
        padding: 24px 16px;
      }
      .editor {
        padding: 12px;
      }
      .title-input {
        font-size: 16px;
      }
      .content-input {
        font-size: 13px;
      }
      .top-bar {
        padding: 0 8px;
      }
      .top-bar-right {
        display: none;
      }
      .notes-count {
        font-size: 11px;
      }
      .sort-label {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">
          <div class="login-logo-dot"></div>
          SIMPLE TRANSFER
        </div>
        <p class="login-subtitle">Your notes, synced across all devices</p>
      </div>
      
      <div class="login-panel">
        <div class="login-tabs">
          <button type="button" class="login-tab active" id="loginTab">LOGIN</button>
          <button type="button" class="login-tab" id="registerTab">REGISTER</button>
        </div>
        
        <form class="login-form" id="authForm">
          <div class="login-input-group">
            <label class="login-input-label" id="emailLabel">EMAIL</label>
            <input type="text" class="login-input-field" id="emailInput" 
                   placeholder="Enter your email" autocomplete="username" required>
          </div>
          
          <div class="login-input-group login-password-toggle">
            <label class="login-input-label">PASSWORD</label>
            <input type="password" class="login-input-field" id="passwordInput" 
                   placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-eye" id="passwordToggle">&#128065;</button>
          </div>
          
          <button type="submit" class="login-btn" id="authSubmit">LOGIN</button>
          
          <div class="login-error" id="authError"></div>
        </form>
        
        <div class="login-divider">
          <span>OR</span>
        </div>
        
        <div class="login-social">
          <button type="button" class="login-social-btn" id="googleSignIn">
            <svg class="login-social-icon" viewBox="0 0 24 24">
              <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

  <!-- MAIN SCREEN -->
  <div class="main-screen" id="mainScreen">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="app-container">
      <div class="sidebar" id="sidebar">

        <div class="search-container">
          <input type="text" class="search-input" id="searchInput" placeholder="SEARCH NOTES...">
          <button class="search-clear" id="searchClear">X</button>

          <span class="notes-count" id="notesCount">0 NOTES</span>

            <button class="action-btn" id="exportBtn" style="display: none;">EXPORT</button>

          <div class="editor" id="editor">
            <div class="empty-state" id="emptyState">SELECT A NOTE TO EDIT</div>
            <textarea class="title-input" id="titleInput" placeholder="Untitled" style="display: none;"></textarea>
            <textarea class="content-input" id="contentInput" placeholder="Start typing..." style="display: none;"></textarea>

  <script>
    // ==================== CONFIGURATION ====================
    const SAVE_DEBOUNCE_MS = 500;
    const SORT_MODES = ['recent', 'created', 'az'];
    const SAVE_STATUS = {
      IDLE: 'SELECT A NOTE TO EDIT',
      SYNCED: 'SYNCED',
      SAVING: 'SAVING...',
      SAVED: 'SAVED',
      ERROR: 'ERROR',
      OFFLINE: 'OFFLINE'
    };

    // ==================== SUPABASE CONFIG ====================
    const SUPABASE_URL = 'https://riraqxbkyzyfwjslqgxl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpcmFxeGJreXp5Zndqc2xxZ3hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjU5ODgsImV4cCI6MjEwMzk0MTk4OH0.SSEkkqNbuyTPProOr7q1cx7iKaWSlP0cRfNEdc25Cpk';

    // ==================== STATE ====================
    let state = {
      user: null,
      notes: [],
      selectedNoteId: null,
      searchQuery: '',
      sortMode: 'recent',
      saveStatus: SAVE_STATUS.IDLE,
      isOnline: navigator.onLine,
      isMobile: false,
      authMode: 'login',
      lastNoteId: null,
      supabase: null,
      isPasswordVisible: false
    };

    // ==================== DOM ELEMENTS ====================
    const elements = {
      // Login Screen
      loginScreen: document.getElementById('loginScreen'),
      mainScreen: document.getElementById('mainScreen'),
      loginTab: document.getElementById('loginTab'),
      registerTab: document.getElementById('registerTab'),
      authForm: document.getElementById('authForm'),
      emailLabel: document.getElementById('emailLabel'),
      emailInput: document.getElementById('emailInput'),
      passwordInput: document.getElementById('passwordInput'),
      passwordToggle: document.getElementById('passwordToggle'),
      authSubmit: document.getElementById('authSubmit'),
      authError: document.getElementById('authError'),
      googleSignIn: document.getElementById('googleSignIn'),
      loginLoading: document.getElementById('loginLoading'),
      
      // Main Screen
      sidebar: document.getElementById('sidebar'),
      userSection: document.getElementById('userSection'),
      userInitial: document.getElementById('userInitial'),
      userName: document.getElementById('userName'),
      logoutBtn: document.getElementById('logoutBtn'),
      searchInput: document.getElementById('searchInput'),
      searchClear: document.getElementById('searchClear'),
      notesCount: document.getElementById('notesCount'),
      sortToggle: document.getElementById('sortToggle'),
      sortLabel: document.getElementById('sortLabel'),
      newNoteBtn: document.getElementById('newNoteBtn'),
      notesList: document.getElementById('notesList'),
      menuBtn: document.getElementById('menuBtn'),
      saveStatus: document.getElementById('saveStatus'),
      copyTitleBtn: document.getElementById('copyTitleBtn'),
      copyContentBtn: document.getElementById('copyContentBtn'),
      exportBtn: document.getElementById('exportBtn'),
      editor: document.getElementById('editor'),
      emptyState: document.getElementById('emptyState'),
      titleInput: document.getElementById('titleInput'),
      contentInput: document.getElementById('contentInput'),
      charCount: document.getElementById('charCount'),
      statusIndicator: document.getElementById('statusIndicator'),
      toast: document.getElementById('toast'),
      mobileOverlay: document.getElementById('mobileOverlay')
    };

    // ==================== SUPABASE INITIALIZATION ====================
    let notesChannel = null;

    function initializeSupabase() {
      try {
        state.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Set up auth state listener
        state.supabase.auth.onAuthStateChange(handleAuthStateChanged);
        
        // Check initial online status
        updateOnlineStatus();
        
        // Set up online/offline detection
        window.addEventListener('online', () => updateOnlineStatus());
        window.addEventListener('offline', () => updateOnlineStatus());
        
        console.log('Supabase initialized successfully');
      } catch (error) {
        console.error('Supabase initialization error:', error);
      }
    }

    function updateOnlineStatus() {
      state.isOnline = navigator.onLine;
      updateStatusIndicator();
      if (state.isOnline) {
        showToast('ONLINE');
        // Re-subscribe to realtime when back online
        if (state.user && !notesChannel) {
          setupNotesRealtime(state.user.id);
        }
      } else {
        showToast('OFFLINE');
      }
    }

    // ==================== AUTH HANDLERS - COMPLETELY REWRITTEN ====================
    
    function handleAuthStateChanged(event, session) {
      if (session) {
        // User is signed in
        state.user = {
          id: session.user.id,
          email: session.user.email,
          displayName: session.user.user_metadata?.user_name || 
                       session.user.email?.split('@')[0] || 
                       'User'
        };
        
        // Load user notes
        loadUserNotes(session.user.id);
        
        // Show main screen, hide login
        elements.loginScreen.classList.add('hidden');
        elements.mainScreen.classList.add('visible');
        
        // Update user info display
        updateUserDisplay();
        
        // Restore last selected note if available
        if (state.lastNoteId) {
          selectNote(state.lastNoteId);
        }
        
        showToast('WELCOME BACK');
      } else {
        // User is signed out
        state.user = null;
        state.notes = [];
        state.selectedNoteId = null;
        
        // Show login screen, hide main
        elements.loginScreen.classList.remove('hidden');
        elements.mainScreen.classList.remove('visible');
        
        // Clear editor
        clearEditor();
        
        // Unsubscribe from notes if was listening
        if (notesChannel) {
          notesChannel.unsubscribe();
          notesChannel = null;
        }
        
        // Reset auth form
        resetAuthForm();
      }
      
      updateUI();
    }

    function updateUserDisplay() {
      if (state.user) {
        const initial = state.user.displayName.charAt(0).toUpperCase();
        elements.userInitial.textContent = initial;
        elements.userName.textContent = state.user.displayName;
      }
    }

    function switchToLoginMode() {
      state.authMode = 'login';
      elements.loginTab.classList.add('active');
      elements.registerTab.classList.remove('active');
      elements.authSubmit.textContent = 'LOGIN';
      elements.emailLabel.textContent = 'EMAIL';
      elements.emailInput.placeholder = 'Enter your email';
      showAuthError('');
    }

    function switchToRegisterMode() {
      state.authMode = 'register';
      elements.loginTab.classList.remove('active');
      elements.registerTab.classList.add('active');
      elements.authSubmit.textContent = 'REGISTER';
      elements.emailLabel.textContent = 'EMAIL';
      elements.emailInput.placeholder = 'Enter your email';
      showAuthError('');
    }

    function resetAuthForm() {
      elements.authForm.reset();
      switchToLoginMode();
      elements.loginLoading.style.display = 'none';
      elements.authSubmit.disabled = false;
    }

    function showAuthError(message) {
      elements.authError.textContent = message;
    }

    function togglePasswordVisibility() {
      state.isPasswordVisible = !state.isPasswordVisible;
      elements.passwordInput.type = state.isPasswordVisible ? 'text' : 'password';
      elements.passwordToggle.textContent = state.isPasswordVisible ? '&#128064;' : '&#128065;';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      
      const email = elements.emailInput.value.trim();
      const password = elements.passwordInput.value;
      
      if (!email || !password) {
        showAuthError('Please enter both email and password');
        return;
      }
      
      // Validate email format
      if (!isValidEmail(email)) {
        showAuthError('Please enter a valid email address');
        return;
      }
      
      if (password.length < 6) {
        showAuthError('Password must be at least 6 characters');
        return;
      }
      
      // Show loading state
      elements.loginLoading.style.display = 'flex';
      elements.authSubmit.disabled = true;
      showAuthError('');
      
      try {
        if (state.authMode === 'register') {
          // Register new user
          const { error } = await state.supabase.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                user_name: email.split('@')[0]
              }
            }
          });
          
          if (error) {
            showAuthError(error.message);
          } else {
            // Registration successful, switch to login mode
            showAuthError('');
            switchToLoginMode();
          }
        } else {
          // Login existing user
          const { error } = await state.supabase.auth.signInWithPassword({
            email: email,
            password: password
          });
          
          if (error) {
            showAuthError(error.message);
          }
        }
      } catch (error) {
        showAuthError(error.message);
      } finally {
        elements.loginLoading.style.display = 'none';
        elements.authSubmit.disabled = false;
      }
    }

    function isValidEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    async function handleGoogleSignIn() {
      try {
        elements.loginLoading.style.display = 'flex';
        const { error } = await state.supabase.auth.signInWithOAuth({
          provider: 'google'
        });
        if (error) {
          showAuthError(error.message);
        }
      } catch (error) {
        showAuthError(error.message);
      } finally {
        elements.loginLoading.style.display = 'none';
      }
    }

    function handleLogout() {
      state.supabase.auth.signOut().catch((error) => {
        console.error('Logout error:', error);
      });
    }

    // ==================== NOTES HANDLERS ====================
    function loadUserNotes(uid) {
      fetchNotes(uid);
      setupNotesRealtime(uid);
    }

    async function fetchNotes(uid) {
      const { data, error } = await state.supabase
        .from('notes')
        .select('*')
        .eq('user_id', uid)
        .order('updated_at', { ascending: false });
      
      if (error) {
        console.error('Error fetching notes:', error);
        return;
      }
      
      state.notes = (data || []).map(note => ({
        id: note.id,
        title: note.title || 'Untitled',
        content: note.content || '',
        pinned: note.pinned || false,
        createdAt: note.created_at ? new Date(note.created_at).getTime() : Date.now(),
        updatedAt: note.updated_at ? new Date(note.updated_at).getTime() : Date.now()
      }));
      
      sortNotes();
      updateNotesList();
      updateNotesCount();
      
      if (!state.selectedNoteId && state.notes.length > 0) {
        selectNote(state.notes[0].id);
      }
    }

    function setupNotesRealtime(uid) {
      // Unsubscribe from previous channel if it exists
      if (notesChannel) {
        notesChannel.unsubscribe();
      }
      
      notesChannel = state.supabase
        .channel('notes_changes')
        .on('postgres_changes', 
          { event: '*', schema: 'public', table: 'notes', filter: `user_id=eq.${uid}` },
          (payload) => {
            const note = {
              id: payload.new.id,
              title: payload.new.title || 'Untitled',
              content: payload.new.content || '',
              pinned: payload.new.pinned || false,
              createdAt: payload.new.created_at ? new Date(payload.new.created_at).getTime() : Date.now(),
              updatedAt: payload.new.updated_at ? new Date(payload.new.updated_at).getTime() : Date.now()
            };
            
            switch (payload.eventType) {
              case 'INSERT':
                state.notes.push(note);
                break;
              case 'UPDATE':
                const index = state.notes.findIndex(n => n.id === note.id);
                if (index !== -1) {
                  state.notes[index] = note;
                }
                break;
              case 'DELETE':
                state.notes = state.notes.filter(n => n.id !== payload.old.id);
                if (state.selectedNoteId === payload.old.id) {
                  clearEditor();
                }
                break;
            }
            
            sortNotes();
            updateNotesList();
            updateNotesCount();
          }
        )
        .subscribe((status) => {
          console.log('Realtime subscription status:', status);
        });
    }

    function sortNotes() {
      switch (state.sortMode) {
        case 'created':
          state.notes.sort((a, b) => b.createdAt - a.createdAt);
          break;
        case 'az':
          state.notes.sort((a, b) => a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }));
          break;
        case 'recent':
        default:
          state.notes.sort((a, b) => b.updatedAt - a.updatedAt);
          break;
      }
      
      // Pinned notes always come first
      state.notes.sort((a, b) => {
        if (a.pinned === b.pinned) return 0;
        return a.pinned ? -1 : 1;
      });
    }

    function cycleSortMode() {
      const currentIndex = SORT_MODES.indexOf(state.sortMode);
      state.sortMode = SORT_MODES[(currentIndex + 1) % SORT_MODES.length];
      elements.sortLabel.textContent = state.sortMode.toUpperCase();
      sortNotes();
      updateNotesList();
    }

    async function createNewNote() {
      if (!state.user) return;
      
      const { data, error } = await state.supabase
        .from('notes')
        .insert({
          user_id: state.user.id,
          title: 'Untitled',
          content: '',
          pinned: false
        })
        .select();
      
      if (error) {
        console.error('Error creating note:', error);
        state.saveStatus = SAVE_STATUS.ERROR;
        updateSaveStatus();
        return;
      }
      
      if (data && data.length > 0) {
        const newNote = {
          id: data[0].id,
          title: 'Untitled',
          content: '',
          pinned: false,
          createdAt: new Date(data[0].created_at).getTime(),
          updatedAt: new Date(data[0].updated_at).getTime()
        };
        
        state.notes.push(newNote);
        sortNotes();
        state.saveStatus = SAVE_STATUS.SAVED;
        updateSaveStatus();
        selectNote(newNote.id);
        
        setTimeout(() => {
          elements.titleInput.focus();
        }, 50);
      }
    }

    function selectNote(noteId) {
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      
      state.selectedNoteId = noteId;
      state.lastNoteId = noteId;
      
      elements.titleInput.value = note.title;
      elements.contentInput.value = note.content;
      
      elements.emptyState.style.display = 'none';
      elements.titleInput.style.display = 'block';
      elements.contentInput.style.display = 'block';
      
      elements.copyTitleBtn.style.display = 'inline-block';
      elements.copyContentBtn.style.display = 'inline-block';
      elements.exportBtn.style.display = 'inline-block';
      
      updateCharCount();
      
      state.saveStatus = SAVE_STATUS.SYNCED;
      updateSaveStatus();
      
      updateNotesList();
    }

    async function deleteNote(noteId, e) {
      if (e) e.stopPropagation();
      
      if (!state.user) return;
      
      const { error } = await state.supabase
        .from('notes')
        .delete()
        .eq('id', noteId);
      
      if (error) {
        console.error('Error deleting note:', error);
        showToast('ERROR DELETING NOTE');
      } else {
        if (state.selectedNoteId === noteId) {
          clearEditor();
        }
        showToast('NOTE DELETED');
      }
    }

    async function togglePinNote(noteId, e) {
      if (e) e.stopPropagation();
      
      if (!state.user) return;
      
      const note = state.notes.find(n => n.id === noteId);
      if (!note) return;
      
      const { error } = await state.supabase
        .from('notes')
        .update({ pinned: !note.pinned })
        .eq('id', noteId);
      
      if (error) {
        console.error('Error toggling pin:', error);
      }
    }

    function updateNoteTitle(title) {
      if (!state.selectedNoteId || !state.user) return;
      
      const note = state.notes.find(n => n.id === state.selectedNoteId);
      if (!note) return;
      
      note.title = title;
      note.updatedAt = Date.now();
      
      debounceSave();
    }

    function updateNoteContent(content) {
      if (!state.selectedNoteId || !state.user) return;
      
      const note = state.notes.find(n => n.id === state.selectedNoteId);
      if (!note) return;
      
      note.content = content;
      note.updatedAt = Date.now();
      
      updateCharCount();
      debounceSave();
    }

    let saveTimeout = null;
    
    function debounceSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      
      state.saveStatus = SAVE_STATUS.SAVING;
      updateSaveStatus();
      
      saveTimeout = setTimeout(() => {
        saveNote();
      }, SAVE_DEBOUNCE_MS);
    }

    async function saveNote() {
      if (!state.selectedNoteId || !state.user) {
        state.saveStatus = SAVE_STATUS.ERROR;
        updateSaveStatus();
        return;
      }
      
      if (!state.isOnline) {
        state.saveStatus = SAVE_STATUS.OFFLINE;
        updateSaveStatus();
        setTimeout(() => saveNote(), 5000);
        return;
      }
      
      const note = state.notes.find(n => n.id === state.selectedNoteId);
      if (!note) return;
      
      const { error } = await state.supabase
        .from('notes')
        .update({
          title: note.title,
          content: note.content,
          updated_at: new Date(note.updatedAt).toISOString()
        })
        .eq('id', state.selectedNoteId);
      
      if (error) {
        console.error('Error saving note:', error);
        state.saveStatus = SAVE_STATUS.ERROR;
        updateSaveStatus();
      } else {
        state.saveStatus = SAVE_STATUS.SAVED;
        updateSaveStatus();
        setTimeout(() => {
          state.saveStatus = SAVE_STATUS.SYNCED;
          updateSaveStatus();
        }, 500);
      }
    }

    function clearEditor() {
      state.selectedNoteId = null;
      state.lastNoteId = null;
      
      elements.titleInput.value = '';
      elements.contentInput.value = '';
      
      elements.emptyState.style.display = 'block';
      elements.titleInput.style.display = 'none';
      elements.contentInput.style.display = 'none';
      
      elements.copyTitleBtn.style.display = 'none';
      elements.copyContentBtn.style.display = 'none';
      elements.exportBtn.style.display = 'none';
      
      elements.charCount.textContent = '';
      
      state.saveStatus = SAVE_STATUS.IDLE;
      updateSaveStatus();
      
      updateNotesList();
    }

    // ==================== SEARCH HANDLERS ====================
    function updateSearch(query) {
      state.searchQuery = query.toLowerCase();
      updateNotesList();
    }

    function getFilteredNotes() {
      if (!state.searchQuery) return state.notes;
      
      return state.notes.filter(note => 
        note.title.toLowerCase().includes(state.searchQuery) ||
        note.content.toLowerCase().includes(state.searchQuery)
      );
    }

    function clearSearch() {
      state.searchQuery = '';
      elements.searchInput.value = '';
      elements.searchClear.style.display = 'none';
      updateNotesList();
    }

    // ==================== UI UPDATES ====================
    function updateNotesList() {
      const filteredNotes = getFilteredNotes();
      
      elements.notesList.innerHTML = '';
      
      if (filteredNotes.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-state';
        emptyDiv.textContent = state.searchQuery ? 'NO NOTES FOUND' : 'NO NOTES YET';
        emptyDiv.style.padding = '20px';
        emptyDiv.style.textAlign = 'center';
        elements.notesList.appendChild(emptyDiv);
      } else {
        filteredNotes.forEach(note => {
          const noteEl = document.createElement('div');
          noteEl.className = `note-item ${state.selectedNoteId === note.id ? 'selected' : ''} ${note.pinned ? 'pinned' : ''}`;
          noteEl.onclick = () => selectNote(note.id);
          
          noteEl.innerHTML = `
            <div class="note-pin ${note.pinned ? 'pinned' : ''}" onclick="togglePinNote('${note.id}', event)">
              ${note.pinned ? '&#9679;' : '&#9675;'}
            </div>
            <div class="note-content">
              <div class="note-title">${escapeHtml(note.title)}</div>
              <div class="note-preview">${escapeHtml(note.content.substring(0, 50))}</div>
            </div>
            <button class="note-delete" onclick="deleteNote('${note.id}', event)">DELETE</button>
          `;
          
          elements.notesList.appendChild(noteEl);
        });
      }
      
      updateNotesCount();
    }

    function updateNotesCount() {
      const total = state.notes.length;
      const pinned = state.notes.filter(n => n.pinned).length;
      elements.notesCount.textContent = `${total} NOTES${pinned > 0 ? ` (${pinned} PINNED)` : ''}`;
    }

    function updateSaveStatus() {
      elements.saveStatus.textContent = state.saveStatus;
    }

    function updateCharCount() {
      const content = elements.contentInput.value;
      elements.charCount.textContent = content ? `${content.length} CHARS` : '';
    }

    function updateStatusIndicator() {
      elements.statusIndicator.className = `status-indicator ${state.isOnline ? 'online' : 'offline'}`;
    }

    function updateUI() {
      const isAuthed = !!state.user;
      
      if (isAuthed) {
        elements.loginScreen.classList.add('hidden');
        elements.mainScreen.classList.add('visible');
      } else {
        elements.loginScreen.classList.remove('hidden');
        elements.mainScreen.classList.remove('visible');
      }
    }

    // ==================== ACTION HANDLERS ====================
    function copyTitle() {
      const title = elements.titleInput.value;
      if (!title) return;
      
      navigator.clipboard.writeText(title).then(() => {
        showToast('TITLE COPIED');
      }).catch(() => {
        showToast('COPY FAILED');
      });
    }

    function copyContent() {
      const content = elements.contentInput.value;
      if (!content) return;
      
      navigator.clipboard.writeText(content).then(() => {
        showToast('CONTENT COPIED');
      }).catch(() => {
        showToast('COPY FAILED');
      });
    }

    function exportNote() {
      if (!state.selectedNoteId) return;
      
      const note = state.notes.find(n => n.id === state.selectedNoteId);
      if (!note) return;
      
      const blob = new Blob([note.content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${note.title || 'note'}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showToast('NOTE EXPORTED');
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add('show');
      
      setTimeout(() => {
        elements.toast.classList.remove('show');
      }, 2000);
    }

    // ==================== MOBILE HANDLERS ====================
    function toggleSidebar() {
      elements.sidebar.classList.toggle('open');
      elements.mobileOverlay.classList.toggle('show');
    }

    function closeSidebar() {
      elements.sidebar.classList.remove('open');
      elements.mobileOverlay.classList.remove('show');
    }

    function detectMobile() {
      state.isMobile = window.innerWidth <= 768;
      
      if (state.isMobile) {
        elements.sidebar.classList.remove('open');
        elements.mobileOverlay.classList.remove('show');
      } else {
        elements.sidebar.classList.add('open');
        elements.mobileOverlay.classList.remove('show');
      }
    }

    // ==================== KEYBOARD SHORTCUTS ====================
    function handleKeyDown(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') {
          if (document.activeElement === elements.searchInput) {
            elements.searchInput.blur();
          }
        }
        if (e.key === 'Tab' && e.target === elements.titleInput) {
          e.preventDefault();
          elements.contentInput.focus();
        }
        return;
      }

      switch (e.key) {
        case 'n':
        case 'N':
          createNewNote();
          break;
        case '/':
          elements.searchInput.focus();
          e.preventDefault();
          break;
        case 'ArrowUp':
          navigateNotes(-1);
          e.preventDefault();
          break;
        case 'ArrowDown':
          navigateNotes(1);
          e.preventDefault();
          break;
        case 'Enter':
          if (state.selectedNoteId) {
            elements.contentInput.focus();
          } else if (state.notes.length > 0) {
            selectNote(state.notes[0].id);
          }
          e.preventDefault();
          break;
        case 'Escape':
          if (document.activeElement === elements.searchInput) {
            elements.searchInput.blur();
          }
          break;
      }
    }

    function navigateNotes(direction) {
      const filteredNotes = getFilteredNotes();
      if (filteredNotes.length === 0) return;
      
      const currentIndex = filteredNotes.findIndex(n => n.id === state.selectedNoteId);
      let newIndex = currentIndex + direction;
      
      if (newIndex < 0) newIndex = filteredNotes.length - 1;
      if (newIndex >= filteredNotes.length) newIndex = 0;
      
      selectNote(filteredNotes[newIndex].id);
    }

    // ==================== UTILITY FUNCTIONS ====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==================== EVENT LISTENERS ====================
    function setupEventListeners() {
      // Login Screen Events
      elements.loginTab.addEventListener('click', switchToLoginMode);
      elements.registerTab.addEventListener('click', switchToRegisterMode);
      elements.authForm.addEventListener('submit', handleAuthSubmit);
      elements.googleSignIn.addEventListener('click', handleGoogleSignIn);
      elements.passwordToggle.addEventListener('click', togglePasswordVisibility);
      
      // Main Screen Events
      elements.logoutBtn.addEventListener('click', handleLogout);
      elements.newNoteBtn.addEventListener('click', createNewNote);
      elements.sortToggle.addEventListener('click', cycleSortMode);
      
      elements.searchInput.addEventListener('input', (e) => {
        updateSearch(e.target.value);
        elements.searchClear.style.display = e.target.value ? 'block' : 'none';
      });
      elements.searchClear.addEventListener('click', clearSearch);
      
      elements.titleInput.addEventListener('input', (e) => updateNoteTitle(e.target.value));
      elements.contentInput.addEventListener('input', (e) => updateNoteContent(e.target.value));
      
      elements.copyTitleBtn.addEventListener('click', copyTitle);
      elements.copyContentBtn.addEventListener('click', copyContent);
      elements.exportBtn.addEventListener('click', exportNote);
      
      elements.menuBtn.addEventListener('click', toggleSidebar);
      elements.mobileOverlay.addEventListener('click', closeSidebar);
      
      document.addEventListener('keydown', handleKeyDown);
      
      window.addEventListener('resize', detectMobile);
      detectMobile();
      
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          if (saveTimeout) {
            clearTimeout(saveTimeout);
            saveNote();
          }
        }
      });
      
      window.addEventListener('beforeunload', () => {
        if (saveTimeout) {
          clearTimeout(saveTimeout);
          saveNote();
        }
      });
    }

    // ==================== INITIALIZATION ====================
    function init() {
      detectMobile();
      initializeSupabase();
      setupEventListeners();
      updateUI();
      updateStatusIndicator();
      console.log('Simple Transfer v2.0 initialized with Supabase');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
